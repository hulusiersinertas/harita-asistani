<!-- DOSYA: index.html (Sadece body içini güncellemen yeterli ama tamamını veriyorum) -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dağıtım Asistanı v3</title>
    <script src="https://api-maps.yandex.ru/v3/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined|Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="app"></div>

    <!-- YENİ ÜST PANEL (FLOATING / YÜZEN TASARIM) -->
    <header class="floating-header">
        <!-- SOL HAP -->
        <div class="header-pill left-pill">
            <span class="material-icons text-gray">menu</span>
            <div class="title-info">
                <h1 id="gorev-baslik">Yükleniyor</h1>
                <span id="kalan-gorev-sayaci">Kalan: --</span>
            </div>
        </div>

        <!-- SAĞ GRUP -->
        <div class="header-right-group">
            <!-- Güzergah Butonu -->
            <button id="guzergah-toggle-btn" class="circle-btn" style="display: none;" title="Güzergah">
                <span class="material-icons-outlined">route</span>
            </button>
            
            <!-- YENİ EKLENEN: GEÇMİŞ BUTONU -->
            <button id="history-btn" class="circle-btn" title="Tamamlananlar">
                <span class="material-icons-outlined">history</span>
            </button>
            <!-- ----------------------------- -->

            <!-- SAĞ HAP: Mahalle Filtresi -->
            <div class="header-pill dropdown-wrapper">
                <span id="mahalle-display-text">Tüm Mahalleler</span>
                <span class="material-icons text-gray">arrow_drop_down</span>
                <select id="mahalle-filtresi" disabled></select>
            </div>
        </div>
    </header>

    <!-- ALT PANEL (Bottom Sheet) -->
    <div id="alt-panel" class="bottom-sheet"></div>

    <!-- NAVİGASYON BUTONU (FAB) -->
    <button id="navigation-toggle-btn" class="fab-btn">
        <span class="material-icons">near_me</span>
    </button>
   <!-- koordinatsizlar butonu -->
    <button id="no-coords-btn" class="fab-btn warning-fab" style="display: none;">
    <span class="material-icons">priority_high</span>
    <span class="badge" id="no-coords-badge">0</span>
</button>

    <!-- HARİTA DÖNDÜRME BUTONLARI (EKRANIN ORTA KENARLARI) -->
<button id="rotate-left" class="circle-btn rotate-control left-edge" title="Sola Döndür">
    <span class="material-icons">rotate_left</span>
</button>

<button id="rotate-right" class="circle-btn rotate-control right-edge" title="Sağa Döndür">
    <span class="material-icons">rotate_right</span>
</button>

    <!-- Scriptler -->
    <script src="./modules/config.js" type="module"></script>
    <script src="./modules/api.js" type="module"></script>
    <script src="./modules/map.js" type="module"></script>
    <script src="./modules/guzergahManager.js" type="module"></script>
    <script src="./modules/navigation.js" type="module"></script>
    <script src="./modules/route.js" type="module"></script>
    <script src="./modules/panelManager.js" type="module"></script>
    <script src="./modules/ui.js" type="module"></script>
    <script src="./script.js" type="module"></script>

<!-- ARAÇ SEÇİM MODALI -->
<div id="arac-secim-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-icon">
            <span class="material-icons">local_shipping</span>
        </div>
        <h2>Araç Seçimi</h2>
        <p>Lütfen dağıtıma çıkacağınız aracı seçiniz.</p>
        
        <div class="arac-grid">
            <button onclick="window.aracSec('OP-1')" class="arac-btn">OP-1</button>
            <button onclick="window.aracSec('OP-2')" class="arac-btn">OP-2</button>
            <button onclick="window.aracSec('TP-1')" class="arac-btn">TP-1</button>
            <button onclick="window.aracSec('TP-2')" class="arac-btn">TP-2</button>
        </div>
    </div>
</div>
</body>
</html>
