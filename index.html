<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dağıtım Görevleri</title>
    <link rel="stylesheet" href="style.css">
    <!-- Yandex API'si en başta yükleniyor -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR&load=package.full" type="text/javascript"></script>
</head>
<body class="harita-odakli">

    <div id="ust-panel">
        <div class="panel-sol">
            <h1 id="arac-baslik">Yükleniyor...</h1>
            <div id="gorev-sayaci"></div>
        </div>
        <div class="panel-sag">
            <select id="mahalle-filtre" class="filtre-kontrolu">
                <option value="TUMU">Tüm Mahalleler</option>
            </select>
            <button id="gorunum-degistir-btn" class="filtre-kontrolu">Listeyi Göster</button>
        </div>
    </div>

    <div id="map"></div>

     <div id="alt-panel">
        <div id="panel-tutamaci"></div>
        
        <div id="gorev-listesi-tam">
            <!-- Görev kartları buraya JavaScript ile eklenecek -->
            
            <!-- YENİ BOŞLUK ELEMANI BURADA -->
            <div class="alt-bosluk"></div>
        </div>

        <div id="gorev-detay">
            <!-- Görev detayı buraya JavaScript ile eklenecek -->

            <!-- YENİ BOŞLUK ELEMANI BURADA -->
            <div class="alt-bosluk"></div>
        </div>
    </div>
    
    <!-- ========================================================================= -->
    <!-- ==== MODÜLER YAPI BAŞLANGICI ==== -->
    <!-- ========================================================================= -->
    <!-- Modüllerimizi doğru sırada yüklüyoruz -->
    <script src="modules/config.js"></script>
    <script src="modules/ui.js"></script>
    <script src="modules/map.js"></script>
    <script src="modules/api.js"></script>
    
    <!-- Orkestra şefi olan ana script'i en son yüklüyoruz -->
    <script src="script.js"></script>
    
    <!-- Google API'sini en son yüklüyoruz ve bittiğinde ana script'teki startApp'ı çağırıyoruz -->
    <script async defer src="https://apis.google.com/js/api.js?onload=startApp"></script>
    <!-- ========================================================================= -->

</body>
</html>
