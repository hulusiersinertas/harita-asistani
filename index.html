<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex Maps API - En Stabil Yükleme Yöntemi</title>
    <style>
        body, html, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            overflow: hidden;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 14px;
            text-align: center;
        }
    </style>
    <!-- 1. KRİTİK DEĞİŞİKLİK: API script'ine, yüklendiğinde hangi fonksiyonu çağıracağını söylüyoruz. -->
    <!-- "onload=onApiReady" parametresi, API hazır olduğunda "onApiReady" fonksiyonunu tetikler. -->
    <script src="https://api-maps.yandex.ru/v3/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR&modules=uiTheme&onload=onApiReady"></script>
</head>
<body>

    <div id="map"></div>
    <div class="info">
        <strong>Masaüstü:</strong> Döndürmek için Ctrl + Sürükle<br>
        <strong>Mobil:</strong> Döndürmek için iki parmağınızı veya pusulayı kullanın
    </div>

    <script type="text/javascript">
        // 2. Bu fonksiyon, Yandex API'si tarafından otomatik olarak çağrılacak.
        // Bu yüzden "ymaps3 is not defined" hatası imkansız hale gelir.
        async function onApiReady() {
            try {
                // ymaps3 nesnesi artık garanti olarak mevcut.
                const {YMap, YMapDefaultSchemeLayer, YMapControls} = ymaps3;
                const {YMapRotateControl} = await ymaps3.import('@yandex/ymaps3-default-ui-theme');
                
                const map = new ymaps3.YMap(document.getElementById('map'), {
                    location: {
                        center: [39.925533, 32.866287],
                        zoom: 12,
                        azimuth: 0,
                        tilt: 0
                    },
                    behaviors: ['drag', 'pinchZoom', 'mouseRotate', 'scrollZoom']
                });

                map.addChild(new ymaps3.YMapDefaultSchemeLayer());

                map.addChild(
                    new YMapControls({position: 'right'}, [
                        new YMapRotateControl({})
                    ])
                );
            } catch (error) {
                console.error('Harita başlatılırken bir hata oluştu:', error);
            }
        }
    </script>

</body>
</html>
