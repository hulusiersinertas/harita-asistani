<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex Maps API - Düzgün Döndürme</title>
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 14px;
            text-align: center;
        }
    </style>
    <script src="https://api-maps.yandex.ru/v3/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR"></script>
</head>
<body>

    <div id="map"></div>
    <div class="info">
        <strong>Masaüstü:</strong> Döndürmek için Ctrl + Sürükle<br>
        <strong>Mobil:</strong> Döndürmek/Yakınlaştırmak için iki parmağınızı kullanın
    </div>

    <script type="text/javascript">
        ymaps3.ready.then(init);

        function init() {
            // Yandex'in tüm standart ve yerleşik davranışlarını aktif ediyoruz.
            const defaultBehaviors = ['drag', 'pinchZoom', 'mouseRotate', 'scrollZoom'];

            const map = new ymaps3.YMap(document.getElementById('map'), {
                // === EN ÖNEMLİ DEĞİŞİKLİK BURADA ===
                location: {
                    center: [39.925533, 32.866287],
                    zoom: 12,
                    // Haritayı "döndürülebilir" olarak başlatmak için
                    // bir başlangıç açısı ve eğimi veriyoruz.
                    azimuth: 0, // Başlangıç açısı (Kuzey)
                    tilt: 0     // Başlangıç eğimi (Dik bakış)
                },
                behaviors: defaultBehaviors
            });

            map.addChild(new ymaps3.YMapDefaultSchemeLayer());
        }
    </script>

</body>
</html>
