<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dağıtım Görevleri v3</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- YANDEX API v3 SCRIPT'İ - NİHAİ VE DOĞRU YÖNTEM -->
    <!-- API anahtarı doğrudan buraya eklenir. Lütfen kendi anahtarınızla değiştirin. -->
    <script src="https://api-maps.yandex.ru/v3/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR"></script>
    
</head>
<body class="harita-odakli">

    <!-- Arayüz elemanları aynı kalır -->
    <div id="ust-panel">
        <div class="panel-sol">
            <h1 id="arac-baslik">Yükleniyor...</h1>
            <div id="gorev-sayaci"></div>
        </div>
        <div class="panel-sag">
            <select id="mahalle-filtre" class="filtre-kontrolu">
                <option value="TUMU">Tüm Mahalleler</option>
            </select>
            <button id="gorunum-degistir-btn" class="filtre-kontrolu">Listeyi Göster</button>
        </div>
    </div>
    <div id="map"></div>
    <div id="alt-panel">
        <div id="gorev-listesi-tam"></div>
        <div id="gorev-detay"></div>
    </div>
    
    <!-- Script Yükleme Sırası -->
    <script src="modules/config.js"></script>
    <script src="modules/ui.js"></script>
    <script src="modules/map.js"></script>
    <script src="modules/api.js"></script>
    <script src="script.js"></script>
    
    <!-- Google API başlatıcısı aynı kalır -->
    <script async defer src="https://apis.google.com/js/api.js?onload=startApp"></script>

</body>
</html>
