<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dağıtım Görevleri</title>
    <link rel="stylesheet" href="style.css">
  <script 
    src="https://api-maps.yandex.ru/v3/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR" 
    type="text/javascript"
    onload="onYandexApiReady()"
    onerror="onYandexApiError()">
</script>
<body class="harita-odakli">

    <div id="ust-panel">
        <div class="panel-sol">
            <h1 id="arac-baslik">Yükleniyor...</h1>
            <div id="gorev-sayaci"></div>
        </div>
        <div class="panel-sag">
            <select id="mahalle-filtre" class="filtre-kontrolu">
                <option value="TUMU">Tüm Mahalleler</option>
            </select>
            <button id="gorunum-degistir-btn" class="filtre-kontrolu">Listeyi Göster</button>
        </div>
    </div>

    <div id="map"></div>

    <div id="alt-panel">
        <div id="panel-tutamaci"></div>
        <div id="gorev-listesi-tam"></div>
        <div id="gorev-detay"></div>
    </div>
    
    <!-- Modüler Yapı -->
    <script src="modules/config.js"></script>
    <script src="modules/ui.js"></script>
    <script src="modules/map.js"></script>
    <script src="modules/api.js"></script>
    
    <!-- Orkestra Şefi -->
    <script src="script.js"></script>
    
    <!-- Google API Başlatıcı -->
    <script async defer src="https://apis.google.com/js/api.js?onload=startApp"></script>

</body>
</html>
