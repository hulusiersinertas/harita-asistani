<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex Maps API - Nihai Çözüm (Babel ile)</title>
    <style>
        body, html, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            overflow: hidden;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 14px;
            text-align: center;
        }
    </style>
    <!-- 1. GEREKLİ ADIM: Babel derleyicisini sayfaya ekliyoruz. -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
    
    <!-- 2. Yandex API'sinin standart script'ini ekliyoruz. -->
    <script src="https://api-maps.yandex.ru/v3/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR"></script>
</head>
<body>

    <div id="map"></div>
    <div class="info">
        <strong>Masaüstü:</strong> Döndürmek için Ctrl + Sürükle<br>
        <strong>Mobil:</strong> Döndürmek için iki parmağınızı veya pusulayı kullanın
    </div>

    <!-- 3. Kodumuzu, Babel'in derleyebilmesi için "text/babel" tipinde bir script içine yazıyoruz. -->
    <script type="text/babel">
        async function init() {
            try {
                // ymaps3.ready'i fonksiyonun başında beklemek en güvenli yöntem.
                await ymaps3.ready;

                const {YMap, YMapDefaultSchemeLayer, YMapControls} = ymaps3;
                const {YMapRotateControl} = await ymaps3.import('@yandex/ymaps3-default-ui-theme');
                
                const map = new ymaps3.YMap(document.getElementById('map'), {
                    location: {
                        center: [39.925533, 32.866287],
                        zoom: 12,
                        azimuth: 0,
                        tilt: 0
                    },
                    behaviors: ['drag', 'pinchZoom', 'mouseRotate', 'scrollZoom']
                });

                map.addChild(new ymaps3.YMapDefaultSchemeLayer());

                map.addChild(
                    new YMapControls({position: 'right'}, [
                        new YMapRotateControl({})
                    ])
                );
            } catch (error) {
                console.error('Harita başlatılırken bir hata oluştu:', error);
            }
        }

        // Fonksiyonu çağırıyoruz.
        init();
    </script>

</body>
</html>
