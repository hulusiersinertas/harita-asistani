<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex Maps API - Nihai Çözüm</title>
    <style>
        body, html, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            overflow: hidden;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 14px;
            text-align: center;
        }
    </style>
    <!-- 1. API'yi "enterprise" modunda yüklüyoruz. -->
    <script src="https://api-maps.yandex.ru/v3/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR&mode=enterprise"></script>
</head>
<body>

    <div id="map"></div>
    <div class="info">
        <strong>Masaüstü:</strong> Döndürmek için Ctrl + Sürükle<br>
        <strong>Mobil:</strong> Döndürmek için iki parmağınızı kullanın
    </div>

    <script type="text/javascript">
        // 2. Kodu çalıştırmadan önce API'nin tamamen hazır olmasını bekliyoruz.
        // Bu, "ymaps3 is not defined" hatasını %100 önler.
        ymaps3.ready.then(init);

        // 3. init fonksiyonunu async olarak işaretliyoruz çünkü içinde await kullanacağız.
        async function init() {
            // async/await yapısı gereği try...catch bloğu eklemek en iyi pratiktir.
            try {
                const {YMap, YMapDefaultSchemeLayer, YMapControls} = ymaps3;

                // Döndürme kontrollerini içeren UI modülünü import ediyoruz.
                const {YMapRotateControl} = await ymaps3.import('@yandex/ymaps3-default-ui-theme');
                
                const map = new ymaps3.YMap(document.getElementById('map'), {
                    location: {
                        center: [39.925533, 32.866287],
                        zoom: 12,
                        azimuth: 0,
                        tilt: 0
                    },
                    behaviors: ['drag', 'pinchZoom', 'mouseRotate', 'scrollZoom']
                });

                map.addChild(new ymaps3.YMapDefaultSchemeLayer());

                // Haritaya Döndürme Kontrolü'nü (Pusula) ekliyoruz.
                map.addChild(
                    new YMapsControls({position: 'right'}, [
                        new YMapRotateControl({})
                    ])
                );
            } catch (error) {
                console.error('Harita başlatılırken bir hata oluştu:', error);
            }
        }
    </script>

</body>
</html>
