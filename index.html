<!DOCTYPE html>
<html>
<head>
    <title>Yandex v3 - Temel Olay Dinleme Testi</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Lütfen bu URL'i dikkatlice kendi API anahtarınızla güncelleyin -->
    <script src="https://api-maps.yandex.ru/v3/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR"></script>
    <style>
        html, body, #app { width: 100%; height: 100%; padding: 0; margin: 0; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="text/javascript">
        main();
        async function main() {
            try {
                await ymaps3.ready;
                const { YMap, YMapDefaultSchemeLayer, YMapListener } = ymaps3;

                console.log("Harita API'si hazır.");

                const map = new YMap(document.getElementById('app'), {
                    location: { center: [32.8597, 39.9334], zoom: 12 }
                });

                map.addChild(new YMapDefaultSchemeLayer({}));

                // Harita durumu her değiştiğinde (kaydırma, zoom vb.) çalışacak fonksiyon.
                const mapUpdateHandler = (eventObject) => {
                    // Bu log, bu yöntemin çalışıp çalışmadığını bize gösterecek en önemli kanıttır.
                    console.log("Harita güncellendi! Yeni merkez:", eventObject.location.center);
                };

                // Dokümanda bulduğumuz YMapListener yöntemini uyguluyoruz.
                const mapListener = new YMapListener({
                    onUpdate: mapUpdateHandler
                });

                map.addChild(mapListener);

                console.log("Olay dinleyici (YMapListener) haritaya eklendi.");
                console.log("Lütfen haritayı kaydırarak veya yakınlaştırarak konsolu test edin.");

            } catch (error) {
                console.error("Harita yüklenirken bir hata oluştu:", error);
            }
        }
    </script>
</body>
</html>
