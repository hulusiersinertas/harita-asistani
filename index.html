<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex Maps API - Resmi Döndürme Butonu (Doğru Yükleyici ile)</title>
    <style>
        body, html, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            overflow: hidden;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 14px;
            text-align: center;
        }
    </style>
    <!-- 1. KRİTİK VE NİHAİ DEĞİŞİKLİK: API'yi, "paket yükleyici" modülüyle birlikte çağırıyoruz. -->
    <script src="https://api-maps.yandex.ru/v3/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR&modules=loader"></script>
</head>
<body>

    <div id="map"></div>
    <div class="info">
        Pusulayı veya Ctrl+Sürükle kullanarak haritayı döndürün.
    </div>

    <script type="text/javascript">
        // API'nin hazır olmasını bekleyen en güvenilir yapı.
        ymaps3.ready.then(init);

        async function init() {
            try {
                const {YMap, YMapDefaultSchemeLayer, YMapControls} = ymaps3;

                // 2. Artık çalışacak olan import komutu:
                // `&modules=loader` sayesinde Yandex bu paketi bulup getirebilecek.
                const {YMapRotateControl} = await ymaps3.import('@yandex/ymaps3-default-ui-theme');
                
                const map = new ymaps3.YMap(document.getElementById('map'), {
                    location: {
                        center: [39.925533, 32.866287],
                        zoom: 12,
                        azimuth: 0,
                        tilt: 0
                    },
                    // Bu davranışlar, pusula butonuyla birlikte standart jestleri de aktif tutar.
                    behaviors: ['drag', 'pinchZoom', 'mouseRotate', 'scrollZoom']
                });

                map.addChild(new ymaps3.YMapDefaultSchemeLayer());

                // 3. Haritaya Yandex'in kendi resmi Döndürme Kontrolü'nü (Pusula) ekliyoruz.
                map.addChild(
                    new YMapControls({position: 'right'}, [
                        new YMapRotateControl({}) // Varsayılan ayarlarla bir pusula butonu oluşturur.
                    ])
                );
            } catch (error) {
                console.error('Harita başlatılırken bir hata oluştu:', error);
            }
        }
    </script>

</body>
</html>
