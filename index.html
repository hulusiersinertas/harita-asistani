<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    
    <!-- DEĞİŞİKLİK: Mobil cihazlarda dokunmatik hareketlerin doğru çalışması için viewport güncellendi -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Yandex Harita Döndürme Kontrolleri</title>

    <script src="https://api-maps.yandex.ru/v3/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR"></script>

    <style>
        html, body, #app {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="text/javascript">
        window.map = null;
        main();

        async function main() {
            try {
                await ymaps3.ready;
                const {
                    YMap,
                    YMapDefaultSchemeLayer,
                    YMapDefaultFeaturesLayer,
                    YMapControls
                } = ymaps3;

                ymaps3.import.registerCdn('https://cdn.jsdelivr.net/npm/{package}/dist/index.js', [
                    '@yandex/ymaps3-default-ui-theme@0.0'
                ]);

                const {
                    YMapRotateControl,
                    YMapTiltControl
                } = await ymaps3.import('@yandex/ymaps3-default-ui-theme');

                const LOCATION = {
                    center: [32.8597, 39.9334],
                    zoom: 12
                };

                const ENABLED_BEHAVIORS = ['drag', 'scrollZoom', 'dblClick', 'mouseTilt', 'mouseRotate', 'touchTilt', 'touchRotate'];

                map = new YMap(
                    document.getElementById('app'),
                    {
                        location: LOCATION,
                        behaviors: ENABLED_BEHAVIORS
                    }
                );

                map.addChild(new YMapDefaultSchemeLayer({}));
                map.addChild(new YMapDefaultFeaturesLayer({}));

                const controls = new YMapControls({ position: 'right' }, [
                    new YMapRotateControl({}),
                    new YMapTiltControl({})
                ]);

                map.addChild(controls);

            } catch (error) {
                console.error("Harita yüklenirken bir hata oluştu:", error);
            }
        }
    </script>
</body>
</html>
