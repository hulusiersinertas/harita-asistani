<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex Maps API - Fare ile Harita Döndürme</title>
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            overflow: hidden; /* Sayfanın kaymasını engeller */
        }
        #map {
            width: 100%;
            height: 100%;
            cursor: grab; /* Farenin normalde sürükleme imleci olmasını sağlar */
        }
        #map.grabbing {
            cursor: grabbing; /* Sürükleme anında imleci değiştirir */
        }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 14px;
        }
    </style>
    <script src="https://api-maps.yandex.ru/v3/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR"></script>
</head>
<body>

    <div id="map"></div>
    <div class="info">Haritayı döndürmek için <strong>Ctrl</strong> tuşuna basılı tutun ve sürükleyin.</div>

    <script type="text/javascript">
        ymaps3.ready.then(init);

        function init() {
            const map = new ymaps3.YMap(document.getElementById('map'), {
                location: {
                    center: [39.925533, 32.866287],
                    zoom: 12
                }
            });

            map.addChild(new ymaps3.YMapDefaultSchemeLayer());
            
            // --- Döndürme Mantığı Değişkenleri ---
            let isCtrlPressed = false;
            let isDragging = false;
            
            let startX = 0;         // Sürüklemenin başladığı X koordinatı
            let startAzimuth = 0;   // Sürüklemenin başladığı andaki harita açısı
            
            // Haritanın son açısını saklamak için bu değişkeni koruyoruz.
            let currentAzimuth = 0;
            
            // Hassasiyet: Farenin 1 piksellik hareketi kaç derecelik dönüş yapsın?
            // Değeri artırırsanız daha hızlı döner, azaltırsanız daha yavaş.
            const SENSITIVITY = 0.5;

            // --- Olay Dinleyicileri ---

            // 1. Ctrl tuşunun durumunu takip et
            window.addEventListener('keydown', (event) => {
                if (event.key === 'Control') {
                    isCtrlPressed = true;
                }
            });

            window.addEventListener('keyup', (event) => {
                if (event.key === 'Control') {
                    isCtrlPressed = false;
                }
            });

            // Yandex Map'in DOM elementini alıyoruz
            const mapElement = map.domElement;

            // 2. Haritaya fare ile tıklandığında
            mapElement.addEventListener('mousedown', (event) => {
                // Sadece Ctrl tuşu basılıysa sürüklemeyi başlat
                if (isCtrlPressed) {
                    isDragging = true;
                    startX = event.clientX;
                    startAzimuth = currentAzimuth;
                    mapElement.classList.add('grabbing'); // İmleci değiştir
                    event.preventDefault(); // Tarayıcının varsayılan sürükleme davranışını engelle
                }
            });
            
            // 3. Fare hareket ettiğinde (Sürükleme)
            // Dinleyiciyi 'window' üzerine ekliyoruz ki fare harita dışına çıksa bile sürükleme devam etsin
            window.addEventListener('mousemove', (event) => {
                if (isDragging) {
                    const deltaX = event.clientX - startX;
                    currentAzimuth = startAzimuth - (deltaX * SENSITIVITY); // Sağa sürükleyince sağa dönmesi için eksi(-) kullanıyoruz.
                    
                    map.setCamera({
                        azimuth: currentAzimuth,
                        // Sürükleme anında animasyon olmamalı, yoksa gecikmeli hissiyatı verir.
                        duration: 0 
                    });
                }
            });

            // 4. Fare tuşu bırakıldığında
            // Dinleyiciyi 'window' üzerine ekliyoruz ki kullanıcı harita dışında bıraksa bile algılansın
            window.addEventListener('mouseup', () => {
                isDragging = false;
                mapElement.classList.remove('grabbing'); // İmleci eski haline getir
            });
        }
    </script>

</body>
</html>
