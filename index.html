<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Yandex Harita Minimal Dokunmatik Test</title>

    <!-- 1. Mobil cihazlar için kritik viewport ayarı -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Kendi API Anahtarınızı eklemeyi unutmayın -->
    <script src="https://api-maps.yandex.ru/v3/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR"></script>

    <style>
        /* Sayfanın tamamını kaplayan temel stiller */
        html, body, #app {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* 2. Tarayıcının dokunmatik olaylara müdahalesini engelleyen kritik CSS kuralı */
        #app {
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="text/javascript">
        main();

        async function main() {
            try {
                // API'nin yüklenmesini bekle
                await ymaps3.ready;
                const { YMap, YMapDefaultSchemeLayer } = ymaps3;

                // 3. Dokunmatik davranışlar dahil tüm temel davranışları etkinleştir
                const BEHAVIORS = ['drag', 'scrollZoom', 'dblClick', 'mouseTilt', 'mouseRotate', 'touchTilt', 'touchRotate'];

                // Haritayı oluştur
                const map = new YMap(
                    document.getElementById('app'),
                    {
                        location: {
                            center: [32.8597, 39.9334], // Ankara
                            zoom: 12
                        },
                        behaviors: BEHAVIORS // Davranışları haritaya uygula
                    }
                );

                // Haritanın görünmesi için temel katmanı ekle
                map.addChild(new YMapDefaultSchemeLayer({}));

            } catch (error) {
                console.error("Minimal harita yüklenirken hata oluştu:", error);
            }
        }
    </script>
</body>
</html>
