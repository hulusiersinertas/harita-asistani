<!DOCTYPE html>
<html>
<head>
    <title>Yandex Haritalar API v2 - Dokunmatik Test</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <!-- 1. Mobil cihazlar için viewport ayarı. Bu v2 için de geçerlidir. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- 2. Yandex Haritalar API v2'yi çağırıyoruz. URL'nin farklı olduğuna dikkat edin. -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR"></script>

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }
        #map {
            /* v3'teki gibi, dokunmatik çakışmalarını önlemek için bu kuralı ekliyoruz. */
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script type="text/javascript">
        // 3. API yüklendiğinde 'init' fonksiyonunu çalıştırır.
        ymaps.ready(init);

        function init() {
            var myMap = new ymaps.Map("map", {
                // Haritanın başlangıç merkezi ve zoom seviyesi
                center: [39.9334, 32.8597], // DİKKAT: v2'de sıralama [enlem, boylam] şeklindedir!
                zoom: 12
            }, {
                // Harita ayarları
                // Arama kutusunu haritadan kaldırır
                searchControlProvider: 'yandex#search'
            });

            // 4. Mobil cihazlarda parmakla döndürmeyi etkinleştiren en önemli ayar!
            myMap.behaviors.enable('multiTouch');
        }
    </script>
</body>
</html>
