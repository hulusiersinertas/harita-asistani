<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <script crossorigin src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
    <!-- To make the map appear, you must add your apikey -->
    <script src="https://api-maps.yandex.ru/v3/?apikey=<b0e9e934-4234-409b-9414-a486ede76f0c>&lang=en_US" type="text/javascript"></script>

    <script
      data-plugins="transform-modules-umd"
      data-presets="typescript"
      type="text/babel"
      src="./common.ts"
    ></script>
    <script
      data-plugins="transform-modules-umd"
      data-presets="typescript"
      type="text/babel"
      src="../variables.ts"
    ></script>
    <script data-plugins="transform-modules-umd" data-presets="typescript" type="text/babel">
      import {YMapControl} from '@yandex/ymaps3-types';
      import {ENABLED_BEHAVIORS} from './common';
      import {LOCATION} from '../variables';

      window.map = null;

      main();
      async function main() {
          await ymaps3.ready;
          const {YMap, YMapDefaultSchemeLayer, YMapDefaultFeaturesLayer, YMapControls, YMapControl} = ymaps3;

          const {YMapRotateControl, YMapRotateTiltControl, YMapTiltControl} = await ymaps3.import(
              '@yandex/ymaps3-default-ui-theme'
          );

          class Tooltip extends ymaps3.YMapComplexEntity<{}> {
              private _element: HTMLDivElement;
              private _control: YMapControl;

              constructor() {
                  super({});
              }

              // Method for create a DOM control element
              _createElement() {
                  const tooltipElement = document.createElement('div');
                  tooltipElement.innerText = 'Click on the buttons on the right side';
                  tooltipElement.classList.add('tooltip');
                  return tooltipElement;
              }

              // Method for attaching the control to the map
              _onAttach() {
                  this._element = this._createElement();
                  this._control = new YMapControl({transparent: true}, this._element);
                  this.addChild(this._control);
              }
          }

          map = new YMap(document.getElementById('app'), {location: LOCATION, behaviors: ENABLED_BEHAVIORS}, [
              new YMapDefaultSchemeLayer({}),
              new YMapDefaultFeaturesLayer({})
          ]);

          map.addChild(new YMapControls({position: 'top left'}, [new Tooltip()]));

          map.addChild(
              new YMapControls({position: 'right'}, [
                  new YMapRotateTiltControl({}),
                  new YMapRotateControl({}),
                  new YMapTiltControl({})
              ])
          );
      }
    </script>

    <!-- prettier-ignore -->
    <style> html, body, #app { width: 100%; height: 100%; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; } .toolbar { position: absolute; z-index: 1000; top: 0; left: 0; display: flex; align-items: center; padding: 16px; } .toolbar a { padding: 16px; }  </style>
    <link rel="stylesheet" href="./common.css" />
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
