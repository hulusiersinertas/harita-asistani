<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex Maps API - Fare ile Harita Döndürme</title>
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            overflow: hidden; /* Sayfanın kaymasını engeller */
        }
        #map {
            width: 100%;
            height: 100%;
            cursor: grab; /* Farenin normalde sürükleme imleci olmasını sağlar */
        }
        #map.grabbing {
            cursor: grabbing; /* Sürükleme anında imleci değiştirir */
        }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 14px;
        }
    </style>
    <script src="https://api-maps.yandex.ru/v3/?apikey=YOUR_API_KEY&lang=tr_TR"></script>
</head>
<body>

    <div id="map"></div>
    <div class="info">Haritayı döndürmek için <strong>Ctrl</strong> tuşuna basılı tutun ve sürükleyin.</div>

    <script type="text/javascript">
        ymaps3.ready.then(init);

        function init() {
            const map = new ymaps3.YMap(document.getElementById('map'), {
                location: {
                    center: [39.925533, 32.866287],
                    zoom: 12
                }
            });

            map.addChild(new ymaps3.YMapDefaultSchemeLayer());
            
            // --- Döndürme Mantığı Değişkenleri ---
            let isCtrlPressed = false;
            let isDragging = false;
            let startX = 0;
            let startAzimuth = 0;
            let currentAzimuth = 0;
            const SENSITIVITY = 0.5;

            // --- Olay Dinleyicileri ---

            window.addEventListener('keydown', (event) => {
                if (event.key === 'Control') isCtrlPressed = true;
            });
            window.addEventListener('keyup', (event) => {
                if (event.key === 'Control') isCtrlPressed = false;
            });

            // === DÜZELTİLEN KISIM BURASI ===
            // 'map.domElement' yerine haritanın kendi div'ini doğrudan seçiyoruz.
            const mapElement = document.getElementById('map');

            mapElement.addEventListener('mousedown', (event) => {
                if (isCtrlPressed) {
                    // Haritanın kendi sürükleme davranışını geçici olarak devre dışı bırakıyoruz.
                    map.behaviors.disable('drag');
                    
                    isDragging = true;
                    startX = event.clientX;
                    startAzimuth = currentAzimuth;
                    mapElement.classList.add('grabbing');
                }
            });
            
            window.addEventListener('mousemove', (event) => {
                if (isDragging) {
                    const deltaX = event.clientX - startX;
                    currentAzimuth = startAzimuth - (deltaX * SENSITIVITY);
                    
                    map.setCamera({
                        azimuth: currentAzimuth,
                        duration: 0 
                    });
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    mapElement.classList.remove('grabbing');
                    // Döndürme bittiğinde haritanın sürükleme davranışını tekrar aktif ediyoruz.
                    map.behaviors.enable('drag');
                }
            });
        }
    </script>

</body>
</html>

</body>
</html>
