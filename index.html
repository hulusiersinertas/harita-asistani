<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex Maps API - Harita Döndürme</title>
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            gap: 10px;
        }
        .controls button {
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
    </style>
    <!-- 
        !!! ÖNEMLİ !!!
        Aşağıdaki satırda bulunan "YOUR_API_KEY" yazısını
        kendi Yandex Maps API anahtarınız ile değiştirmelisiniz.
    -->
    <script src="https://api-maps.yandex.ru/v3/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR"></script>
</head>
<body>

    <div id="map"></div>

    <div class="controls">
        <button id="rotate-left">Sola Döndür</button>
        <button id="rotate-right">Sağa Döndür</button>
    </div>

    <script type="text/javascript">
    ymaps3.ready.then(init);

    function init() {
        const map = new ymaps3.YMap(document.getElementById('map'), {
            location: {
                center: [39.925533, 32.866287],
                zoom: 12
            }
        });

        map.addChild(new ymaps3.YMapDefaultSchemeLayer());

        const rotateLeftButton = document.getElementById('rotate-left');
        const rotateRightButton = document.getElementById('rotate-right');
        const ROTATION_STEP = 20;

        // Haritanın mevcut açısını takip etmek için bir değişken kullanıyoruz.
        // Bu mantığın doğru çalıştığını önceki denemelerde kanıtladık.
        let currentAzimuth = 0;

        rotateLeftButton.addEventListener('click', () => {
            // Açıyı kendi değişkenimize göre güncelliyoruz.
            currentAzimuth -= ROTATION_STEP;
            updateCamera();
        });

        rotateRightButton.addEventListener('click', () => {
            // Açıyı kendi değişkenimize göre güncelliyoruz.
            currentAzimuth += ROTATION_STEP;
            updateCamera();
        });

        function updateCamera() {
            console.log("Kamera güncelleniyor, yeni azimuth:", currentAzimuth);

            // DOKÜMANLARDAN ÖĞRENDİĞİMİZ:
            // setLocation yerine, özellikle kamerayı döndürmek için tasarlanmış
            // setCamera metodunu kullanıyoruz.
            map.setCamera({
                azimuth: currentAzimuth,
                duration: 400 // Animasyon süresi (milisaniye)
            });
        }
    }
</script>
</body>
</html>
