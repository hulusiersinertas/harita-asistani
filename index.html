<!DOCTYPE html>
<html>
<head>
    <title>Yandex Harita v3 - map.update İzolasyon Testi</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <script src="https://api-maps-yandex-ru.translate.goog/v3/?apikey=b0e9e934-4234-409b-9414-a486ede76f0c&lang=tr_TR&_x_tr_sl=en&_x_tr_tl=tr&_x_tr_hl=tr&_x_tr_pto=wapp"></script>

    <style>
        html, body, #app {
            width: 100%; height: 100%;
            padding: 0; margin: 0;
            overflow: hidden;
        }
        #test-button {
            position: absolute;
            z-index: 1000;
            top: 10px;
            left: 10px;
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <!-- Sadece tek bir test butonu -->
    <button id="test-button">HARİTAYI 45 DERECE DÖNDÜR</button>

    <script type="text-javascript">
        // Global map değişkeni
        let map;

        main();
        async function main() {
            await ymaps3.ready;
            const { YMap, YMapDefaultSchemeLayer } = ymaps3;

            map = new YMap(
                document.getElementById('app'),
                {
                    location: {
                        center: [32.8597, 39.9334],
                        zoom: 12,
                        bearing: 0
                    }
                }
            );

            map.addChild(new YMapDefaultSchemeLayer({}));

            // Test butonuna tıklama olayı
            document.getElementById('test-button').addEventListener('click', () => {
                console.log('Test butonuna tıklandı. Harita güncellenmeye çalışılıyor...');
                
                // HİPOTEZ: Bu komutun çalışması gerekiyor.
                // Haritanın mevcut durumunu tamamen göz ardı edip,
                // onu sabit ve yeni bir duruma getirmeye zorluyoruz.
                map.update({
                    location: {
                        center: [32.8597, 39.9334], // Merkez sabit
                        zoom: 12,                  // Zoom sabit
                        bearing: 45,               // Açıyı 45 derece yap
                        duration: 1000             // 1 saniyelik animasyonla
                    }
                });

                console.log('map.update komutu gönderildi.');
            });
        }
    </script>
</body>
</html>
